[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-trance"
version = "0.2.0"
description = "Assess a column's distribution, then transform it -- a config-driven pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    "Pillow>=9.0",
    "PyYAML>=6.0",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dl = ["torch>=2.0"]

[project.scripts]
data-trance = "data_trance.cli:main"

[tool.setuptools.packages.find]
include = ["data_trance*"]

[tool.setuptools.package-data]
"data_trance.ml" = ["models/*.joblib", "models/*.pt", "models/*.txt"]
